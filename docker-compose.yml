# CazzKB Docker Compose
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    # Path relative to compose file: resolves to d:/CazzTech/.env (workspace root)
    env_file:
      - ../../.env
    volumes:
      - ./backend:/app
      - kb_data:/app/data
    environment:
      - OLLAMA_HOST=${CAZZKB_OLLAMA_HOST:-http://localhost:11434}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cazztech

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - cazztech

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama
    networks:
      - cazztech

volumes:
  kb_data:
  ollama_data:

networks:
  cazztech:
    name: cazztech
