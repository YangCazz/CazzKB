# CazzKB default configuration
kb:
  name: "Default"
  chunk_size: 512
  chunk_overlap: 50
  top_k: 8
  similarity_threshold: 0.65

embedding:
  factory: "ollama"
  model: "bge-m3"
  dimension: 1024
  api_key: ""
  base_url: "http://localhost:11434"

llm:
  # DeepSeek via Anthropic-compatible endpoint
  # Available factories: anthropic, deepseek (native OpenAI-compatible)
  factory: "anthropic"
  model: "deepseek-v4-pro[1m]"
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "https://api.deepseek.com/anthropic"
  max_tokens: 4096
  thinking_budget_tokens: 2048

retrieval:
  rrf_k: 60
  dense_weight: 0.7
  candidate_multiplier: 3    # RRF outputs top_k × N, reranker trims to top_k

reranker:
  factory: "none"            # bge | llm | none (set to "bge" after ollama pull bge-reranker)
  model: "BAAI/bge-reranker-v2-m3"

storage:
  chroma_path: "data/chroma"
  db_path: "data/cazzkb.db"
  upload_path: "data/uploads"
